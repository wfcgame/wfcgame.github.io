backend:
  name: github
  repo: wfcgame/wfcgame.github.io
  branch: main

local_backend: true

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: blog
    label: Articles
    label_singular: Article
    folder: src/content/blog
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: description, widget: text }
      - { label: Cover image, name: coverImage, widget: image, required: false }
      - { label: Publish date, name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Last updated, name: updatedDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: Article, name: body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Creator, name: author, widget: string, required: false, hint: "Credit the original creator when featuring someone else's work." }
      - { label: Fictional concept, name: concept, widget: boolean, default: false, required: false, hint: "Mark ideas or fictional portfolio examples clearly." }
      - { label: Project image, name: image, widget: image, required: false }
      - { label: URL, name: href, widget: string, required: false, hint: "Leave blank for concepts without a live project." }
      - { label: Related article, name: article, widget: string, required: false, hint: "Optional internal URL, such as /blog/my-article/." }
      - label: Technologies
        name: tags
        widget: list
        required: false
        field: { label: Technology, name: tag, widget: string }
